[package]
name = "pokebot-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Shared by the ESP32-S3 firmware (xtensa-esp32s3-espidf, std) and the host
# simulator, so keep dependencies to what builds on ESP-IDF.
[dependencies]
pokebot-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "pokebot-remote-sim"
path = "src/bin/sim.rs"
