[package]
name = "pokebot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pokebot"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
minifb = { version = "0.28.0", optional = true }
pokebot-agent.workspace = true
pokebot-capture-card.workspace = true
pokebot-controller.workspace = true
pokebot-core.workspace = true
pokebot-emulator-libretro.workspace = true
pokebot-gamedata.workspace = true
pokebot-pabotbase.workspace = true
pokebot-planner.workspace = true
pokebot-replay.workspace = true
pokebot-runtime.workspace = true
pokebot-state.workspace = true
pokebot-telemetry.workspace = true
pokebot-video.workspace = true
pokebot-virtual-console.workspace = true
pokebot-vision.workspace = true
pokebot-world.workspace = true
serde_json = "1.0.151"

[features]
default = ["viewer"]
viewer = ["dep:minifb"]
