[package]
name = "pokebot-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
pokebot-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync", "time"] }
